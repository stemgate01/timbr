<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Timbr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700&family=DM+Mono&family=Cabinet+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #05080f;
  --surface: #0b0f1a;
  --surface2: #111827;
  --surface3: #161e2e;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.11);
  --accent: #00d4aa;
  --accent2: #00b894;
  --accent-dim: rgba(0,212,170,0.08);
  --white: #f0f4f8;
  --gray: #7a8899;
  --gray2: #a0adb8;
  --red: #f0566a;
  --red-dim: rgba(240,86,106,0.09);
  --green: #10d48e;
  --green-dim: rgba(16,212,142,0.09);
  --orange: #f59e0b;
  --orange-dim: rgba(245,158,11,0.09);
  --radius: 9px;
  --radius-lg: 13px;
  --transition: .18s cubic-bezier(.4,0,.2,1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Cabinet Grotesk', sans-serif;
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.register-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 40px;
  width: 100%;
  max-width: 440px;
}
.logo-area {
  text-align: center;
  margin-bottom: 28px;
}
.logo-area img { height: 40px; margin-bottom: 12px; }
.logo-area h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 700;
}
.logo-area p { color: var(--gray); font-size: 14px; margin-top: 4px; }
.form-group { margin-bottom: 18px; }
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--gray2);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.form-group input {
  width: 100%;
  padding: 12px 16px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--white);
  font-family: 'Cabinet Grotesk', sans-serif;
  font-size: 15px;
  transition: border-color var(--transition);
  outline: none;
}
.form-group input:focus { border-color: var(--accent); }
.form-group input::placeholder { color: var(--gray); }
.form-hint {
  font-size: 11px;
  color: var(--gray);
  margin-top: 4px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  border-radius: var(--radius);
  font-family: 'Cabinet Grotesk', sans-serif;
  font-weight: 600;
  font-size: 14px;
  border: none;
  cursor: pointer;
  transition: all var(--transition);
  width: 100%;
}
.btn-primary {
  background: var(--accent);
  color: #05080f;
}
.btn-primary:hover { background: var(--accent2); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.error-msg {
  background: var(--red-dim);
  border: 1px solid rgba(240,86,106,0.3);
  color: var(--red);
  padding: 10px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}
.error-msg.show { display: block; }
.success-msg {
  background: var(--green-dim);
  border: 1px solid rgba(16,212,142,0.3);
  color: var(--green);
  padding: 10px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}
.success-msg.show { display: block; }
.extra-links {
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
  color: var(--gray);
}
.extra-links a { color: var(--accent); }
.spinner {
  width: 18px; height: 18px;
  border: 2px solid transparent;
  border-top-color: currentColor;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
.btn.loading .spinner { display: inline-block; }
.btn.loading .btn-text { display: none; }
@media (max-width: 480px) {
  .register-container { padding: 28px 20px; }
}
</style>
</head>
<body>

<div class="register-container">
  <div class="logo-area">
    <img src="/images/timbr.png" height="40" alt="Timbr">
    <h1>Join Timbr</h1>
    <p>Start tracking your growth</p>
  </div>

  <div class="error-msg" id="error"></div>
  <div class="success-msg" id="success"></div>

  <form id="registerForm" autocomplete="off">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="John Doe" required>
    </div>
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="johndoe" required>
      <p class="form-hint">Must be unique. Used for leaderboard and search.</p>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary" id="submitBtn">
      <span class="btn-text">Create Account</span>
      <span class="spinner"></span>
    </button>
  </form>

  <div class="extra-links">
    Already have an account? <a href="/login.html">Sign in</a>
  </div>
</div>

<script>
const API_BASE = '/api';
const errorEl = document.getElementById('error');
const successEl = document.getElementById('success');
const submitBtn = document.getElementById('submitBtn');

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.classList.add('show');
  successEl.classList.remove('show');
}

function showSuccess(msg) {
  successEl.textContent = msg;
  successEl.classList.add('show');
  errorEl.classList.remove('show');
}

function setLoading(loading) {
  if (loading) {
    submitBtn.classList.add('loading');
    submitBtn.disabled = true;
  } else {
    submitBtn.classList.remove('loading');
    submitBtn.disabled = false;
  }
}

// Generate simple device fingerprint
function getDeviceFingerprint() {
  const data = [
    navigator.userAgent,
    navigator.language,
    screen.width + 'x' + screen.height,
    navigator.hardwareConcurrency || 'unknown',
    Intl.DateTimeFormat().resolvedOptions().timeZone
  ].join('|');
  return btoa(data).slice(0, 64);
}

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  showError('');
  showSuccess('');
  
  const name = document.getElementById('name').value.trim();
  const username = document.getElementById('username').value.trim().toLowerCase();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  
  if (!name || !username || !email || !password) {
    showError('Please fill in all fields');
    return;
  }
  
  if (password.length < 6) {
    showError('Password must be at least 6 characters');
    return;
  }
  
  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    showError('Username: 3-20 chars, letters, numbers, underscores only');
    return;
  }
  
  setLoading(true);
  
  try {
    const res = await fetch(`${API_BASE}/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name,
        username,
        email,
        password,
        device_fingerprint: getDeviceFingerprint()
      })
    });
    
    const data = await res.json();
    
    if (!res.ok) {
      showError(data.error || 'Registration failed');
      setLoading(false);
      return;
    }
    
    showSuccess('Account created! Awaiting admin approval. You will be able to login once approved.');
    document.getElementById('registerForm').reset();
    setLoading(false);
    
    setTimeout(() => {
      window.location.href = '/login.html';
    }, 3000);
  } catch (err) {
    showError('Network error. Please try again.');
    setLoading(false);
  }
});
</script>

</body>
</html>
